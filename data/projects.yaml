#  projects.yaml
# ══════════════════════════════════════════════════════════
#
#  Fields per entry:
#    title       (required)
#    period      (required)  e.g. "Jun 2025 – Present"
#    desc        (required)  2–4 sentences
#    tags                    list of {label, style} or plain strings
#    links                   list of {label, url}  (GitHub, paper, demo, etc.)
#    highlight               true → renders with a stronger left accent (for flagship projects)

projects:
  - title: "POACHA: Partial Order Alignment Computation Hardware Acceleration"
    period: "Jun 2025 – Present"
    highlight: true
    desc: >
      FPGA and ASIC design for sequence-to-graph alignment using the
      Myers bit-parallel algorithm with bit-vector representation.
      Implements dynamic programming by slice on hardware, targeting
      accelerated genomic alignment for long-read sequencing pipelines.
      Ongoing work at AlkanLab; presented at CGSI UCLA 2025.
    tags:
      - label: "SystemVerilog"
        style: "blue"
      - label: "FPGA"
        style: "blue"
      - label: "ASIC"
        style: "blue"
      - label: "C++"
        style: "brown"
      - label: "Genomics"
        style: "green"
    links: []

  - title: "DELTIS: Deep Learning Thermal Image Super-Resolution"
    period: "Sep 2024 – May 2025"
    highlight: false
    desc: >
      Collaboration with TUBITAK to improve the resolution of compact
      low-cost infrared cameras. Curated a novel thermal image dataset
      and developed a deep learning super-resolution model, benchmarked
      against three state-of-the-art methods with integrated evaluation metrics.
    tags:
      - label: "Python"
        style: "blue"
      - label: "PyTorch"
        style: "green"
      - label: "Deep Learning"
        style: "brown"
      - label: "Computer Vision"
        style: "brown"
    links: []

  - title: "Edge-AI Deployment on GAP9 (RISC-V)"
    period: "Summer 2024"
    highlight: false
    desc: >
      Pre-trained and fine-tuned 10 CNN and Vision Transformer models on a
      multimodal skin cancer dataset at ETH Zurich IIS. Applied structured
      pruning and quantization for hardware-efficient inference, then deployed
      the optimized models on the RISC-V–based GAP9 edge-AI platform.
    tags:
      - label: "PyTorch"
        style: "green"
      - label: "RISC-V"
        style: "blue"
      - label: "Quantization"
        style: "brown"
      - label: "ViT / CNN"
        style: "brown"
    links: []

  - title: "Smart Home System on FPGA"
    period: "Fall 2023"
    highlight: false
    desc: >
      BASYS3 FPGA–based smart home system implementing temperature and
      motion detection. PIR sensor triggers LED on motion; LM35 analog
      sensor feeds a custom ADC pipeline with real-time 7-segment display.
      Implemented in VHDL.
    tags:
      - label: "VHDL"
        style: "blue"
      - label: "FPGA"
        style: "blue"
      - label: "Embedded"
        style: "brown"
    links: []

  - title: "TRC-11 Transceiver"
    period: "Spring 2023"
    highlight: false
    desc: >
      Designed and implemented a 27 MHz transceiver (11 m wavelength)
      from schematic through PCB layout to physical assembly and testing.
    tags:
      - label: "PCB Design"
        style: "brown"
      - label: "RF / Analog"
        style: "brown"
    links: []