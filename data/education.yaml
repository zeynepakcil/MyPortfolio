# ══════════════════════════════════════════════════════════
#  education.yaml
# ══════════════════════════════════════════════════════════
#
#  Fields per entry:
#    degree       (required)  Full degree title
#    school       (required)  Institution name
#    location     (required)  City, Country / State
#    school_url              Link to department/school page
#    start        (required)  e.g. "Sep 2021"
#    end          (required)  e.g. "Jun 2025"  |  "Present"
#    gpa                     e.g. "3.9 / 4.0"  — omit to hide
#    honors                  e.g. "High Distinction"  — omit to hide
#    advisor                 Advisor name  — omit to hide
#    thesis                  Thesis title (italicised)  — omit to hide
#    note                    Free-text note shown in the blue callout box
#    type         (required)  "phd" | "masters" | "ug"   (controls icon + dot color)
#    coursework              List of notable courses — omit to hide

