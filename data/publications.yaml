# ══════════════════════════════════════════════════════════
#  publications.yaml
# ══════════════════════════════════════════════════════════
#
#  Leave `publications` as an empty list [] to hide the section entirely.
#
#  Fields per entry:
#    year        (required)
#    title       (required)
#    venue       (required)  Conference or journal name
#    venue_short             Abbreviation, e.g. "ISCA '25"
#    authors     (required)  List of author names; use "**Your Name**" to bold yours
#    links                   List of {label, url} pairs (arXiv, PDF, Code, etc.)
#    note                    e.g. "Best Paper Award"  — omit to hide

publications: []

