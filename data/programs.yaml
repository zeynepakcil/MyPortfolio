    host: "Hosted by [Organization]"
    location: "City, Country"
    year: "Summer 2024"
    url: ""
    note: ""

  - name: "Research Program / Workshop Name"
    host: "Hosted by [Organization]"
    location: "City, Country"
    year: "Summer 2023"
    url: ""
    note: "Competitive selection"

  - name: "Hackathon / Competitive Program"
    host: "[Organization]"
    location: ""
    year: "2023"
    url: ""
    note: ""
